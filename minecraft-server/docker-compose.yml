# Servidor de Minecraft Java + Bedrock (PC y PlayStation) con mods Fabric.
#   - Java (PC):            puerto 25565/TCP
#   - Bedrock (PS/Xbox/móvil/Win10): puerto 19132/UDP (lo abre Geyser)
# Arranque:  docker compose up -d     Logs:  docker compose logs -f
services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc-crossplay
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - "25565:25565/tcp"   # Java
      - "19132:19132/udp"   # Bedrock (Geyser)
    env_file: .env
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      # Geyser para Fabric solo sale para la última versión de Java,
      # así que dejamos LATEST para que todos los mods cuadren.
      VERSION: "LATEST"
      # Mods desde Modrinth. Todos son de servidor: los de PlayStation
      # no pueden instalar mods, así que solo valen mods que no hagan
      # falta en el cliente.
      MODRINTH_PROJECTS: |
        fabric-api
        geyser
        floodgate
        lithium
        ferrite-core
        chunky
        terralith
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      MODRINTH_ALLOWED_VERSION_TYPE: "release"
      # Ajustes del mundo
      MOTD: "§aServidor crossplay §7PC + PlayStation"
      DIFFICULTY: "normal"
      MODE: "survival"
      MAX_PLAYERS: "20"
      VIEW_DISTANCE: "10"
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      # Los de Bedrock no tienen cuenta Java: Floodgate les deja entrar
      # con su cuenta de Xbox/Microsoft (aparecen con un "." delante).
      ONLINE_MODE: "true"
    volumes:
      - ./data:/data

  # Túnel gratis de playit.gg (opción A del README): evita abrir puertos.
  # Solo arranca con:  docker compose --profile playit up -d
  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    profiles: ["playit"]
    restart: unless-stopped
    environment:
      SECRET_KEY: ${PLAYIT_SECRET}
