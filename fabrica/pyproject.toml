[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabrica-juegos"
version = "0.1.0"
description = "Fábrica de recursos para juegos: un director reparte el trabajo entre agentes de IA."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
fabrica = "fabrica.cli:main"

[tool.setuptools.packages.find]
include = ["fabrica*"]

[tool.setuptools.package-data]
fabrica = ["plantilla/*.toml", "plantilla/flujos/*.json"]
