# Dos procesos sobre la misma BD SQLite (volumen compartido): panel web y trabajador.
services:
  web:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"   # expón a Internet solo detrás de un proxy con HTTPS
    volumes:
      - datos:/srv/data
      - ./backups:/srv/backups
      - ./reports:/srv/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 60s
  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.cli", "worker"]
    volumes:
      - datos:/srv/data
      - ./backups:/srv/backups
      - ./reports:/srv/reports
    restart: unless-stopped
    depends_on: [web]
volumes:
  datos:
