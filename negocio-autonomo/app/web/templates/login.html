{% extends "base.html" %}
{% block title %}Acceso{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:40px auto">
  <h1>Acceso de administración</h1>
  {% if error %}<p class="alert critical">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <p><label>Usuario<br><input name="username" autocomplete="username" required></label></p>
    <p><label>Contraseña<br><input name="password" type="password" autocomplete="current-password" required></label></p>
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
