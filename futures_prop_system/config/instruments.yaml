# Librería de especificaciones de contratos de futuros.
#
# ⚠️  Márgenes y comisiones son VALORES ORIENTATIVOS. Los márgenes de exchange
#     cambian con frecuencia (especialmente en metales y energía) y los márgenes
#     intradía dependen del broker/prop firm. Verifícalos antes de operar.
# ⚠️  Horarios en America/Chicago (CT). RTH = sesión "regular" de referencia.
#
# tick_value DEBE ser multiplier * tick_size (se valida al cargar).
# mini_equivalent: cuánto cuenta el contrato para el límite de contratos de la
# firma (las firmas suelen contar 10 micros = 1 mini).

contracts:
  # ---------------------------------------------------------------- Índices
  ES:
    name: E-mini S&P 500
    exchange: CME
    asset_class: equity_index
    multiplier: 50
    tick_size: 0.25
    tick_value: 12.5
    months: HMUZ
    expiry_rule: equity_index
    session: {timezone: America/Chicago, rth_open: "08:30", rth_close: "15:00"}
    roll: {method: volume, days_before: 6, max_days_before: 10, confirm_days: 1, position_policy: flatten}
